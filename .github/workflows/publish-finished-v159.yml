name: Publish standalone FC3D v159 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-finished-v159.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover exact verified v159 source
        run: |
          cat checkpoints/v159_transport/checkpoint_payload.part* > checkpoints/v159_transport/checkpoint_payload.b64
          python checkpoints/v159_transport/checkpoint_transport_v1.py "$GITHUB_WORKSPACE"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('3dprint_black_mirror_wave_grid_v1.159.py')
          expected = 'f73b1a7f10fc97c1f9fb9112bb7ab38c0fcfa4cc73da91899df820cda66fd57a'
          assert p.is_file()
          assert p.stat().st_size == 360895
          assert hashlib.sha256(p.read_bytes()).hexdigest() == expected
          print('verified', p, p.stat().st_size, expected)
          PY
      - name: Commit complete standalone source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 3dprint_black_mirror_wave_grid_v1.159.py
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete standalone v159 converter source'
            git push origin HEAD:main
          fi
