name: Archive finished FC3D v159 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-finished-v159.yml']

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unpack checksum-verified completed local source and records
        run: |
          cat checkpoints/v159_transport/checkpoint_payload.part* > checkpoints/v159_transport/checkpoint_payload.b64
          python checkpoints/v159_transport/checkpoint_transport_v1.py "$GITHUB_WORKSPACE"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('3dprint_black_mirror_wave_grid_v1.159.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f73b1a7f10fc97c1f9fb9112bb7ab38c0fcfa4cc73da91899df820cda66fd57a'
          PY
      - name: Install the locally verified release dependencies
        run: python -m pip install -r checkpoints/v159/requirements.txt
      - name: Build archival fixture copies from the frozen finished source
        run: python -u checkpoints/v159/replay_finished_files_v1.py
      - name: Enforce publication size and integrity rules
        run: |
          find checkpoints/v159 -type d -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('checkpoints/v159')
          receipt=json.loads((root/'publication_receipt.json').read_text())
          assert receipt['status']=='PASS' and receipt['matched_instruction_streams']==17
          for p in [Path('3dprint_black_mirror_wave_grid_v1.159.py'),Path('ALR_PROJECT_HANDOVER.md'),*root.rglob('*')]:
              if p.is_file():
                  assert p.stat().st_size<=50_000_000,(str(p),p.stat().st_size)
          assert hashlib.sha256(Path('3dprint_black_mirror_wave_grid_v1.159.py').read_bytes()).hexdigest()==receipt['exporter_source_sha256']
          PY
      - name: Commit the completed source, fixtures and verification records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 3dprint_black_mirror_wave_grid_v1.159.py ALR_PROJECT_HANDOVER.md checkpoints/v159
          if ! git diff --cached --quiet; then
            git commit -m 'Archive verified standalone v159, print fixtures and local audit checkpoint'
            git push origin HEAD:main
          fi
      - name: Expose the completed checkpoint for read-back verification
        uses: actions/upload-artifact@v4
        with:
          name: fc3d-v159-verified-release
          path: |
            3dprint_black_mirror_wave_grid_v1.159.py
            3dprintv1.179.py
            ALR_PROJECT_HANDOVER.md
            checkpoints/v159
          retention-days: 30
          if-no-files-found: error
