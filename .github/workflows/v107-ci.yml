name: FC3D v1.113 release validation

on:
  push:
    branches:
      - fc3d-v1.107-correct-u-profile
    paths:
      - '3dprint_black_mirror_wave_grid_v1.106.py'
      - '3dprint_black_mirror_wave_grid_v1.107.py'
      - '3dprint_black_mirror_wave_grid_v1.108.py'
      - '3dprint_black_mirror_wave_grid_v1.109.py'
      - '3dprint_black_mirror_wave_grid_v1.110.py'
      - '3dprint_black_mirror_wave_grid_v1.113.py'
      - '3dprintv1.179.py'
      - 'test_v110_contract.py'
      - 'test_v113_contract.py'
      - 'independent_v110_audit.py'
      - '.github/workflows/v107-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow tifffile
      - name: Source contract and compile
        run: |
          python test_v110_contract.py
          python test_v113_contract.py
          python -m py_compile 3dprint_black_mirror_wave_grid_v1.113.py
      - name: Dry validate v1.113 release wrapper
        run: |
          python 3dprint_black_mirror_wave_grid_v1.113.py --source 3dprintv1.179.py --piece 1-2 --dry-validate | tee v113_dry.log
          ! grep -F 'DRY V1.106 VALIDATION' v113_dry.log
          grep -F 'DRY V1.113 VALIDATION' v113_dry.log
          grep -F 'v1.113 geometry fingerprint  : PASS' v113_dry.log
