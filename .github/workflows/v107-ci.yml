name: FC3D v1.110 Orca candidate validation

on:
  push:
    branches:
      - fc3d-v1.107-correct-u-profile
    paths:
      - '3dprint_black_mirror_wave_grid_v1.106.py'
      - '3dprint_black_mirror_wave_grid_v1.107.py'
      - '3dprint_black_mirror_wave_grid_v1.108.py'
      - '3dprint_black_mirror_wave_grid_v1.109.py'
      - '3dprint_black_mirror_wave_grid_v1.110.py'
      - '3dprintv1.179.py'
      - 'test_v107_contract.py'
      - 'test_v108_contract.py'
      - 'test_v109_contract.py'
      - 'test_v110_contract.py'
      - 'independent_v110_audit.py'
      - '.github/workflows/v107-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orca-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow tifffile
      - name: Preserve source regressions and compile
        run: |
          python test_v107_contract.py
          python test_v108_contract.py
          python test_v109_contract.py
          python test_v110_contract.py
          python -m py_compile 3dprint_black_mirror_wave_grid_v1.110.py independent_v110_audit.py
      - name: Dry validate v1.110
        run: python 3dprint_black_mirror_wave_grid_v1.110.py --source 3dprintv1.179.py --piece 1-2 --dry-validate
      - name: Generate Orca v1.110 package
        run: python 3dprint_black_mirror_wave_grid_v1.110.py --source 3dprintv1.179.py --piece 1-2 --slicer-target orca --output black_a_only_sparse_global_u_profile_wave_sets_valleyfill25_1_2_v1.110.gcode.3mf
      - name: Independent direct-XYZ package audit
        run: python independent_v110_audit.py black_a_only_sparse_global_u_profile_wave_sets_valleyfill25_1_2_v1.110.gcode.3mf | tee independent_v110_audit.json
      - name: Candidate hashes
        run: |
          sha256sum 3dprint_black_mirror_wave_grid_v1.110.py black_a_only_sparse_global_u_profile_wave_sets_valleyfill25_1_2_v1.110.gcode.3mf | tee v110_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fc3d-v1.110-orca-candidate
          if-no-files-found: error
          path: |
            3dprint_black_mirror_wave_grid_v1.110.py
            black_a_only_sparse_global_u_profile_wave_sets_valleyfill25_1_2_v1.110.gcode.3mf
            black_a_only_sparse_global_u_profile_wave_sets_valleyfill25_1_2_v1.110.gcode.3mf.*.csv
            independent_v110_audit.json
            v110_sha256.txt
