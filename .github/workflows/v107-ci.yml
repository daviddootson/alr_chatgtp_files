name: FC3D v1.110 sparse global u-profile validation

on:
  push:
    branches:
      - fc3d-v1.107-correct-u-profile
    paths:
      - '3dprint_black_mirror_wave_grid_v1.106.py'
      - '3dprint_black_mirror_wave_grid_v1.107.py'
      - '3dprint_black_mirror_wave_grid_v1.108.py'
      - '3dprint_black_mirror_wave_grid_v1.109.py'
      - '3dprint_black_mirror_wave_grid_v1.110.py'
      - '3dprintv1.179.py'
      - 'test_v107_contract.py'
      - 'test_v108_contract.py'
      - 'test_v109_contract.py'
      - 'test_v110_contract.py'
      - 'independent_v110_audit.py'
      - '.github/workflows/v107-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow tifffile
      - name: Preserve previous source regressions
        run: |
          python test_v107_contract.py
          python test_v108_contract.py
          python test_v109_contract.py
      - name: Compile v1.110
        run: python -m py_compile 3dprint_black_mirror_wave_grid_v1.110.py
      - name: Run v1.110 source contract
        run: python test_v110_contract.py
      - name: Run v1.110 dry sparse-global validation
        run: python 3dprint_black_mirror_wave_grid_v1.110.py --source 3dprintv1.179.py --piece 1-2 --dry-validate
