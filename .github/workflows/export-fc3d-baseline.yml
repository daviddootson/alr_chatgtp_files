name: Export FC3D baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-fc3d-baseline.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@v4
      - name: Upload source snapshot for local use (no generation or tests)
        uses: actions/upload-artifact@v4
        with:
          name: fc3d-baseline
          path: |
            3dprint_black_mirror_wave_grid_v1.106.py
            3dprint_black_mirror_wave_grid_v1.156.py
            3dprint_black_mirror_wave_grid_v1.157.py
            3dprint_black_mirror_wave_grid_v1.158.py
            3dprintv1.179.py
            ALR_PROJECT_HANDOVER.md
            tests/test_v157_thin_cap.py
            tests/test_v158_cap_z_fix.py
          if-no-files-found: error
          retention-days: 30
